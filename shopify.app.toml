# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

# Canonical app = the PUBLIC "Aviva" app (client_id 85ae9145…), which is the
# one wired into Vercel (SHOPIFY_API_KEY) and the correct distribution type for
# clients OAuth-connecting their own stores from the portal. The old custom
# app b3858838… ("Aviva International", custom-install-link distribution) is
# NOT used — custom apps can't be OAuth-installed on arbitrary merchant stores.
# `shopify app deploy` from here pushes the redirect URL + scopes below to the
# 85ae9145 app so its config always matches this file.
client_id = "85ae9145ae6b3d221cefce38e68aa76a"
name = "Aviva International"
application_url = "https://avivainternational.co"
embedded = false

[build]

[webhooks]
api_version = "2026-04"

# GDPR / privacy webhooks live in their OWN section — they aren't
# regular [[webhooks.subscriptions]] topics. Each Shopify app MUST
# expose these three endpoints to clear the automated review queue.
# Our handler at /api/shopify-compliance routes all three by the
# X-Shopify-Topic header.
[webhooks.privacy_compliance]
customer_data_request_url = "https://avivainternational.co/api/shopify-compliance"
customer_deletion_url     = "https://avivainternational.co/api/shopify-compliance"
shop_deletion_url         = "https://avivainternational.co/api/shopify-compliance"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_fulfillments,read_orders,read_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://avivainternational.co/api/shopify-oauth-callback" ]

[pos]
embedded = false
